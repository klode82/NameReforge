[project]
name = "nameforge"
version = "0.4.0"
description = "Batch-rename files with a live preview and undo: a modern, cross-platform alternative to Ant Renamer."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["PySide6>=6.6", "mutagen>=1.47", "Pillow>=10"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "ruff"]
build = ["pyinstaller>=6"]

[project.gui-scripts]
nameforge = "nameforge.app:main"

[build-system]
requires = ["setuptools>=77"]  # 77: campo license come espressione SPDX (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
nameforge = ["assets/*", "assets/i18n/*.json", "assets/i18n/help/*.json"]
