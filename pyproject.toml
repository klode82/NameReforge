[project]
name = "nameforge"
version = "0.1.0"
description = "Ridenominazione massiva di file: alternativa moderna e multipiattaforma ad Ant Renamer."
requires-python = ">=3.12"
dependencies = ["PySide6>=6.6", "mutagen>=1.47"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "ruff"]

[project.gui-scripts]
nameforge = "nameforge.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
