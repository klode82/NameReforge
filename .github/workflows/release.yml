# Su tag vX.Y.Z: compila con PyInstaller su ogni sistema, prova il binario (--selftest) e allega gli artefatti alla release.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]  # Ubuntu LTS più vecchio: glibc compatibile con più distro
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0
      - run: pip install -e ".[dev,build]"
      - run: pytest -q
      - name: Build
        working-directory: packaging
        run: pyinstaller nameforge.spec --noconfirm --distpath ../dist --workpath ../build
      - name: Selftest (Linux)
        if: runner.os == 'Linux'
        run: dist/NameReforge/NameReforge --selftest
      - name: Selftest (Windows)
        if: runner.os == 'Windows'
        run: dist\NameReforge\NameReforge.exe --selftest
      - name: Selftest (macOS)
        if: runner.os == 'macOS'
        run: dist/NameReforge.app/Contents/MacOS/NameReforge --selftest
      - name: Pacchetto Linux
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/NameReforge-${{ github.ref_name }}-linux-x86_64.tar.gz NameReforge
      - name: Pacchetto Windows
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress
          iscc packaging\installer.iss /DAppVersion=${{ github.ref_name }}
      - name: Pacchetto macOS
        if: runner.os == 'macOS'
        run: hdiutil create -volname NameReforge -srcfolder dist/NameReforge.app -ov -format UDZO dist/NameReforge-${{ github.ref_name }}-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: nameforge-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*-setup.exe
            dist/*.dmg
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
