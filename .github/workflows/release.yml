# Su tag vX.Y.Z: compila con PyInstaller su ogni sistema, prova il binario (--selftest) e allega gli artefatti alla release.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]  # Ubuntu LTS più vecchio: glibc compatibile con più distro
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0
      - run: pip install -e ".[dev,build]"
      - run: pytest -q
      - name: Build
        working-directory: packaging
        run: pyinstaller nameforge.spec --noconfirm --distpath ../dist --workpath ../build
      - name: Selftest (Linux)
        if: runner.os == 'Linux'
        run: dist/NameReforge/NameReforge --selftest
      - name: Selftest (Windows)
        if: runner.os == 'Windows'
        run: dist\NameReforge\NameReforge.exe --selftest
      - name: Selftest (macOS)
        if: runner.os == 'macOS'
        run: dist/NameReforge.app/Contents/MacOS/NameReforge --selftest
      - name: Pacchetto Linux
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/NameReforge-${{ github.ref_name }}-linux-x86_64.tar.gz NameReforge
      - name: Pacchetti Linux (deb, rpm, AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y rpm ruby ruby-dev build-essential
          sudo gem install fpm --no-document
          sudo curl -fsSL -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          packaging/linux/build_packages.sh "${{ github.ref_name }}"
      - name: Prova dei pacchetti Linux in container puliti
        if: runner.os == 'Linux'
        run: |
          # solo le dipendenze dichiarate nei pacchetti: se ne manca una, l'avvio fallisce qui
          for img in ubuntu:22.04 ubuntu:24.04; do
            docker run --rm -e QT_QPA_PLATFORM=offscreen -e LANG=C.UTF-8 -v "$PWD/dist":/pkgs:ro $img \
              bash -c 'apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /pkgs/*.deb && nameforge --selftest'
          done
          docker run --rm -e QT_QPA_PLATFORM=offscreen -e LANG=C.UTF-8 -v "$PWD/dist":/pkgs:ro fedora:latest \
            bash -c 'dnf install -y -q /pkgs/*.rpm && nameforge --selftest'
      - name: Pacchetto Windows
        if: runner.os == 'Windows'
        run: |
          choco install innosetup -y --no-progress
          iscc packaging\installer.iss /DAppVersion=${{ github.ref_name }}
      - name: Pacchetto macOS
        if: runner.os == 'macOS'
        run: hdiutil create -volname NameReforge -srcfolder dist/NameReforge.app -ov -format UDZO dist/NameReforge-${{ github.ref_name }}-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: nameforge-${{ runner.os }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*-setup.exe
            dist/*.dmg
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
